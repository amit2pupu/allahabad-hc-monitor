<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 260px;
        }
        .display {
            width: 100%;
            height: 40px;
            font-size: 1.2rem;
            text-align: right;
            padding: 5px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 15px;
            font-size: 1rem;
            border: none;
            border-radius: 4px;
            background: #ececec;
            cursor: pointer;
            transition: background 0.2s;
        }
        button.operator {
            background: #ff9500;
            color: #fff;
        }
        button:hover {
            background: #d4d4d4;
        }
        button.operator:hover {
            background: #e08900;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="text" class="display" id="display" disabled />
        <div class="keys">
            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button data-value="/" class="operator">÷</button>
            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button data-value="*" class="operator">×</button>
            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button data-value="-" class="operator">−</button>
            <button data-value="0">0</button>
            <button data-value=".">.</button>
            <button id="clear">C</button>
            <button data-value="+" class="operator">+</button>
            <button id="equals" class="operator" style="grid-column: span 4;">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        let current = '';

        function updateDisplay() {
            display.value = current;
        }

        document.querySelectorAll('.keys button').forEach(btn => {
            btn.addEventListener('click', () => {
                const val = btn.getAttribute('data-value');
                if (btn.id === 'clear') {
                    current = '';
                } else if (btn.id === 'equals') {
                    try {
                        // evaluate expression safely
                        // replace ÷ × with / * is already done by data-value
                        const result = eval(current);
                        current = String(result);
                    } catch (e) {
                        current = 'Error';
                    }
                } else {
                    // prevent multiple dots in a number
                    if (val === '.') {
                        const parts = current.split(/\+|\-|\*|\//);
                        const last = parts[parts.length - 1];
                        if (last.includes('.')) return;
                    }
                    current += val;
                }
                updateDisplay();
            });
        });

        // allow keyboard input
        document.addEventListener('keydown', e => {
            const keys = '0123456789+-*/.';
            if (keys.includes(e.key)) {
                document.querySelector(`button[data-value="${e.key}"]`)?.click();
            } else if (e.key === 'Enter') {
                document.getElementById('equals').click();
            } else if (e.key === 'Backspace') {
                current = current.slice(0, -1);
                updateDisplay();
            }
        });
    </script>
</body>
</html>
